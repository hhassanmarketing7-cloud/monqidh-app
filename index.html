<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أحمد المطور — Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1a1a;
            --secondary: #666;
            --light: #f5f5f5;
            --border: #e5e5e5;
            --accent: #2563eb;
            --accent-light: #dbeafe;
            --danger: #dc2626;
            --success: #16a34a;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Arabic', sans-serif;
            color: var(--primary);
            background: #fff;
            line-height: 1.6;
        }

        /* Hero */
        .hero {
            padding: 80px 24px 48px;
            text-align: center;
            background: linear-gradient(180deg, #fafafa 0%, #fff 100%);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 600;
            margin: 0 auto 24px;
            box-shadow: var(--shadow);
        }

        .hero h1 {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .hero p {
            font-size: 17px;
            color: var(--secondary);
            margin-bottom: 28px;
        }

        .badges {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .badge {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid var(--border);
            font-size: 14px;
            color: var(--secondary);
            background: #fff;
            transition: all 0.2s;
        }

        .badge:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Sections */
        .section {
            padding: 48px 24px;
            max-width: 900px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary);
            display: inline-block;
        }

        /* Projects */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .project-card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fff;
        }

        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: var(--primary);
        }

        .project-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 20px;
        }

        .project-card h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .project-card p {
            font-size: 14px;
            color: var(--secondary);
            line-height: 1.6;
        }

        .project-tags {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .project-tag {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 6px;
            background: var(--light);
            color: var(--secondary);
        }

        /* Skills */
        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 15px;

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق منقذ - الطوارئ</title>
    <!-- استدعاء Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء خطوط Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 800px;
            background-color: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 40px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- حاوية الهاتف الرئيسية (تطابق الشاشة الرئيسية رقم 4 في الصورة) -->
    <div class="app-container">
        
        <!-- شريط الحالة العلوي -->
        <div class="flex justify-between items-center px-6 pt-4 text-gray-800 text-sm font-semibold">
            <span>9:41</span>
            <div class="flex items-center space-x-1 space-x-reverse text-xs">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- رأس الصفحة (الشعار والترحيب) -->
        <div class="flex justify-between items-center px-6 pt-4">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center text-red-600 shadow-sm">
                    <i class="fa-regular fa-bell text-lg"></i>
                </div>
            </div>
            <div class="text-left">
                <h2 class="text-xs text-gray-500">أهلاً بك، حسان</h2>
                <p class="text-[10px] text-gray-400">تمنى لك يوماً آمناً</p>
            </div>
            <div class="text-gray-700 text-lg">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>

        <!-- محتوى الشاشة الرئيسية (زر النجدة الكبير) -->
        <div class="flex-1 flex flex-col items-center justify-center px-6 relative">
            <!-- دوائر التموج الخلفية لزر النجدة -->
            <div class="absolute w-72 h-72 rounded-full bg-red-50 animate-pulse"></div>
            <div class="absolute w-60 h-60 rounded-full bg-red-100 opacity-80"></div>
            
            <!-- زر النجدة الرئيسي -->
            <button onclick="openEmergencyScreen()" class="relative z-10 w-48 h-48 rounded-full bg-gradient-to-b from-red-500 to-red-700 text-white flex flex-col items-center justify-center shadow-2xl border-4 border-white transition transform active:scale-95">
                <i class="fa-solid fa-bell text-4xl mb-2 animate-bounce"></i>
                <span class="text-xl font-black tracking-wide">طلب النجدة</span>
            </button>
            
            <p class="mt-8 text-xs text-gray-400 font-medium">اضغط عند الحاجة للمساعدة</p>
        </div>

        <!-- شريط التنقل السفلي -->
        <div class="bg-white border-t border-gray-100 py-3 px-6 flex justify-around items-center text-center text-gray-400 text-xs">
            <div class="flex flex-col items-center">
                <i class="fa-solid fa-user-shield text-base mb-1"></i>
                <span>جهات الطوارئ</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fa-solid fa-file-lines text-base mb-1"></i>
                <span>السجل</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fa-solid fa-gear text-base mb-1"></i>
                <span>الإعدادات</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fa-solid fa-user text-base mb-1"></i>
                <span>الملف الشخصي</span>
            </div>
            <div class="flex flex-col items-center text-red-600">
                <i class="fa-solid fa-house text-base mb-1"></i>
                <span class="font-bold">الرئيسية</span>
            </div>
        </div>
    </div>

    <!-- شاشة العد التنازلي لطلب النجدة (مخفية افتراضياً، تطابق الشاشة رقم 5) -->
    <div id="emergencyModal" class="fixed inset-0 bg-red-700 z-50 hidden flex-col justify-between p-6 text-white max-w-[400px] h-[800px] m-auto rounded-[40px] shadow-2xl">
        <!-- شريط علوي -->
        <div class="flex justify-between items-center text-sm font-semibold">
            <span>9:41</span>
            <div class="flex items-center space-x-1 space-x-reverse text-xs">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- محتوى شاشة الطوارئ -->
        <div class="flex flex-col items-center justify-center text-center">
            <h2 class="text-lg font-bold mb-2">طلب النجدة</h2>
            <p class="text-xs text-red-100 mb-10">سيتم إرسال طلب النجدة خلال</p>
            
            <!-- عداد تنازلي كبير -->
            <div id="countdownNumber" class="text-9xl font-black mb-12 tracking-tighter">5</div>

            <!-- زر إلغاء -->
            <button onclick="closeEmergencyScreen()" class="w-44 py-3 rounded-full border border-white/40 text-white font-bold text-sm tracking-wide bg-red-800/40 hover:bg-red-800 transition">
                إلغاء
            </button>
        </div>

        <!-- تذييل شاشة الطوارئ -->
        <div class="text-center pb-4">
            <p class="text-[11px] text-red-100">سيتم إرسال موقعك الحالي</p>
            <p class="text-[11px] text-red-100">إلى جهات الطوارئ المحددة</p>
        </div>
    </div>

    <!-- كود جافاسكريبت للتحكم بالعد التنازلي والشاشات -->
    <script>
        let countdownInterval;

        function openEmergencyScreen() {
            const modal = document.getElementById('emergencyModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            let timeLeft = 5;
            document.getElementById('countdownNumber').innerText = timeLeft;

            countdownInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft >= 0) {
                    document.getElementById('countdownNumber').innerText = timeLeft;
                }
                if (timeLeft < 0) {
                    clearInterval(countdownInterval);
                    alert("تم إرسال استغاثة الطوارئ بنجاح!");
                    closeEmergencyScreen();
                }
            }, 1000);
        }

        function closeEmergencyScreen() {
            clearInterval(countdownInterval);
            const modal = document.getElementById('emergencyModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
</html>
